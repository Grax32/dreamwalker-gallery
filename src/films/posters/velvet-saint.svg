<path d="M0 430 Q 180 380, 300 420 T600 515 V900 H0Z" fill="#11151d" opacity=".74"/>
<path d="M0 650 Q 150 502, 360 540 T600 490" fill="none" stroke="#c83c42" stroke-opacity=".28" stroke-width="3"/>
<g opacity=".92">
  <circle cx="300" cy="402" r="48" fill="#c83c42" opacity=".17"/>
  <rect x="286" y="422" width="28" height="110" rx="12" fill="#f5f1e8" opacity=".55"/>
</g>
<rect width="600" height="900" filter="url(#noise)" opacity=".7"/>
<style>
