<path d="M0 475 Q 180 380, 300 464 T600 515 V900 H0Z" fill="#0d1b21" opacity=".74"/>
<path d="M0 650 Q 150 454, 360 575 T600 550" fill="none" stroke="#b8d9df" stroke-opacity=".28" stroke-width="3"/>
<g opacity=".92">
  <circle cx="300" cy="402" r="48" fill="#b8d9df" opacity=".17"/>
  <rect x="286" y="422" width="28" height="110" rx="12" fill="#f5f1e8" opacity=".55"/>
</g>
<rect width="600" height="900" filter="url(#noise)" opacity=".7"/>
<style>
.title{font-family:Georgia,serif;font-size:44px;font-weight:700;letter-spacing:3px;fill:#f3eee5}
